services:
  # Tier 3: Persistence Layer (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: featureflag_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: feature_flags
    ports:
      - "3307:3306"
    volumes:
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Tier 2: Business Logic & REST API Layer (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: featureflag_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: feature_flags
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy

  # Tier 1: Presentation Layer (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: featureflag_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
